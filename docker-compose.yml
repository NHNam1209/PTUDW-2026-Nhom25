version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: culinary_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - culinary_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: culinary_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=culinary_blog
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/culinary_blog
      - SYNC_DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/culinary_blog
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_URL=http://localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - MINIO_BUCKET_NAME=culinary-blog
      - MINIO_SECURE=false
      - SECRET_KEY=supersecretjwtkeythatmustbeatleast32characterslongforhs256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - culinary_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: culinary_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - culinary_network

  postgres:
    image: postgres:16-alpine
    container_name: culinary_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=culinary_blog
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d culinary_blog"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - culinary_network

  redis:
    image: redis:7-alpine
    container_name: culinary_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - culinary_network

  minio:
    image: minio/minio:latest
    container_name: culinary_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadminpassword
    volumes:
      - miniodata:/data
    networks:
      - culinary_network

  minio-init:
    image: minio/mc:latest
    container_name: culinary_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb myminio/culinary-blog || true;
      /usr/bin/mc anonymous set download myminio/culinary-blog;
      exit 0;
      "
    networks:
      - culinary_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: culinary_mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - culinary_network

networks:
  culinary_network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
